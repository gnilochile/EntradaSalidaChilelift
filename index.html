<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141B20">
<title>Control de Acceso — Chilelift</title>
<style>
:root{--bg:#141B20;--panel:#1D272E;--panel-2:#25323B;--line:#33434E;
  --ink:#EAF1F4;--muted:#8298A5;--entra:#C9F04A;--sale:#FFA23A;--alert:#FF6A57;--note:#6EC5FF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.mark{font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.mark span{color:var(--entra)}
.shift{text-align:right;font-size:10px;line-height:1.3;color:var(--muted)}
.shift b{display:block;color:var(--ink);font-size:11.5px}
.screen{padding:16px 16px 0;flex:1;display:none;flex-direction:column;overflow-y:auto}
.screen.on{display:flex}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;
  color:var(--muted);font-weight:600;margin-bottom:6px}
h2{font-size:23px;font-weight:600;line-height:1.15;margin-bottom:14px}
.guards{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.guard{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);
  border-radius:14px;background:var(--panel);width:100%;color:var(--ink);
  font-family:inherit;font-size:15px;text-align:left}
.guard[aria-pressed="true"]{border-color:var(--entra);background:var(--panel-2)}
.ini{width:32px;height:32px;flex:none;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:13px;
  font-weight:700;color:var(--muted)}
.guard[aria-pressed="true"] .ini{background:var(--entra);color:#141B20;border-color:var(--entra)}
.pindots{display:flex;gap:9px;justify-content:center;margin:4px 0 14px}
.pindot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line)}
.pindot.f{background:var(--entra);border-color:var(--entra)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.key{padding:13px 0;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:19px;font-variant-numeric:tabular-nums}
.key.ghost{border-color:transparent;background:transparent;font-size:13px;color:var(--muted)}
.pinwrap.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#stage{position:relative;background:#000;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);aspect-ratio:3/4;margin-bottom:12px}
video{width:100%;height:100%;object-fit:cover;display:block}
canvas{display:none}
.frame{position:absolute;inset:16% 12%;border:2px solid var(--entra);border-radius:10px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.3);pointer-events:none}
.frame span{position:absolute;bottom:-25px;left:0;right:0;text-align:center;
  font-size:11px;color:var(--entra)}
.dir{border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line);
  background:var(--panel);position:relative;overflow:hidden}
.dir::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--entra)}
.dir.out::before{background:var(--sale)}
.dirtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.arrow{font-size:38px;line-height:.85;color:var(--entra);font-weight:700}
.dir.out .arrow{color:var(--sale)}
.dirword{font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.dirsub{font-size:11px;color:var(--muted);margin-top:2px}
.flip{margin-left:auto;padding:9px 12px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-family:inherit;font-size:12px;flex:none}
.who{font-size:21px;font-weight:600;line-height:1.2}
.rows{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;
  display:flex;flex-direction:column;gap:7px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.row dt{color:var(--muted)}
.row dd{font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  border:1px solid var(--line);color:var(--muted)}
.tag.auto{border-color:var(--entra);color:var(--entra)}
.tag.man{border-color:var(--alert);color:var(--alert)}
.nota{background:rgba(110,197,255,.09);border:1px solid rgba(110,197,255,.4);
  border-radius:12px;padding:12px;margin-bottom:12px;font-size:13.5px;
  line-height:1.5;color:#CFE9FF}
.nota .k{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--note);margin-bottom:5px;font-weight:600}
.nota .exp{display:block;margin-top:7px;font-size:11px;color:var(--note);opacity:.85}
.nota.vencida{background:rgba(255,106,87,.08);border-color:rgba(255,106,87,.4);color:#FFC5BB}
.nota.vencida .k{color:var(--alert)}
label{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-family:inherit;font-size:16px}
input::placeholder{color:#5C707C}
.hint{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.actions{margin-top:auto;position:sticky;bottom:0;
  background:linear-gradient(to bottom,transparent,var(--bg) 22%);
  padding:14px 0;display:flex;flex-direction:column;gap:8px}
.btn{padding:16px;border-radius:13px;border:0;width:100%;font-family:inherit;
  font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  background:var(--entra);color:#141B20}
.btn.out{background:var(--sale)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--muted);
  font-size:14px;letter-spacing:.04em;text-transform:none}
.btn:disabled{background:var(--panel-2);color:#5C707C}
.tick{width:62px;height:62px;border-radius:50%;background:var(--entra);color:#141B20;
  display:grid;place-items:center;font-size:31px;margin:24px auto 12px;font-weight:700}
.tick.out{background:var(--sale)}
.savedname{text-align:center;font-size:23px;font-weight:600}
.savedmeta{text-align:center;color:var(--muted);font-size:12.5px;margin-top:3px}
.log{display:flex;flex-direction:column;gap:7px}
.entry{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;border-left:3px solid var(--entra);font-size:12.5px}
.entry.out{border-left-color:var(--sale)}
.entry.flag{border-left-color:var(--alert)}
.entry time{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.entry .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{background:rgba(255,106,87,.09);border:1px solid rgba(255,106,87,.35);
  border-radius:12px;padding:13px;font-size:12.5px;line-height:1.5;
  margin-bottom:12px;color:#FFC5BB}
.warn b{color:var(--alert);display:block;font-size:13.5px;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:4px}
.pend{position:fixed;bottom:0;left:0;right:0;background:var(--sale);color:#141B20;
  text-align:center;padding:7px;font-size:12px;font-weight:600;display:none;z-index:9}
.pend.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="mark">Control<span>·</span>Acceso</div>
  <div class="shift" id="shiftbox"><b>Sin turno</b>Nadie a cargo</div>
</div>

<section class="screen on" id="s-turno">
  <div class="eyebrow">Inicio de turno</div>
  <h2>¿Quién está de turno?</h2>
  <div class="guards" id="guards"><div class="hint">Cargando…</div></div>
  <div class="pinwrap" id="pinwrap">
    <div class="eyebrow" id="pinlabel">Clave de 4 dígitos</div>
    <div class="pindots" id="dots"></div>
    <div class="pad" id="pad"></div>
  </div>
</section>

<section class="screen" id="s-scan">
  <div class="eyebrow">Turno activo</div>
  <h2>Escanea el carnet</h2>
  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <div class="frame"><span id="scanmsg">Apunta al QR del reverso</span></div>
  </div>
  <canvas id="c"></canvas>
  <div class="actions">
    <button class="btn" id="camBtn">Encender cámara</button>
    <button class="btn sec" id="torchBtn" style="display:none">Linterna</button>
    <button class="btn sec" id="noIdBtn">Registrar sin carnet</button>
    <button class="btn sec" id="closeBtn">Cerrar turno</button>
  </div>
</section>

<section class="screen" id="s-confirm">
  <div class="eyebrow" id="c-eyebrow">Carnet leído</div>
  <div id="c-nota"></div>
  <div class="dir" id="dirCard">
    <div class="dirtop">
      <div class="arrow" id="c-arrow">&rarr;</div>
      <div>
        <div class="dirword" id="c-word">Entrada</div>
        <div class="dirsub" id="c-why"></div>
      </div>
      <button class="flip" id="flipBtn">Cambiar</button>
    </div>
    <div class="who" id="c-name">—</div>
    <dl class="rows" id="c-rows"></dl>
  </div>
  <div id="newBlock" style="display:none">
    <label for="f-name">Nombre completo — no está en la nómina</label>
    <input id="f-name" placeholder="Nombre y apellidos" autocomplete="off">
    <label for="f-type">Tipo</label>
    <select id="f-type">
      <option>Externo</option><option>Interno</option><option>Guardia</option>
    </select>
  </div>
  <div id="manualRun" style="display:none">
    <label for="f-run">RUN</label>
    <input id="f-run" placeholder="12345678-9" autocomplete="off">
  </div>
  <label for="f-plate">Patente <span style="opacity:.6">— opcional</span></label>
  <input id="f-plate" placeholder="JKLM34" maxlength="8" autocomplete="off">
  <div class="hint" id="plateHint"></div>
  <label for="f-why">Motivo <span style="opacity:.6">— opcional</span></label>
  <input id="f-why" placeholder="Retiro de herramienta" autocomplete="off">
  <div class="actions">
    <button class="btn" id="saveBtn">Confirmar entrada</button>
    <button class="btn sec" id="cancelBtn">Cancelar</button>
  </div>
</section>

<section class="screen" id="s-saved">
  <div class="tick" id="tick">&check;</div>
  <div class="savedname" id="s-name">—</div>
  <div class="savedmeta" id="s-meta">—</div>
  <div class="eyebrow" style="margin-top:24px">Movimientos de este turno</div>
  <div class="log" id="log"></div>
  <div class="actions"><button class="btn" id="nextBtn">Registrar otra persona</button></div>
</section>

<section class="screen" id="s-close">
  <div class="eyebrow">Fin de turno</div>
  <h2>Revisa antes de cerrar</h2>
  <div id="closeBody"></div>
  <div class="actions">
    <button class="btn" id="confirmClose">Cerrar turno</button>
    <button class="btn sec" id="backBtn">Volver</button>
  </div>
</section>

<div class="pend" id="pendBar"></div>

<script>
/* ------------------------------------------------------------------
   CONFIGURACION — lo unico que se toca al desplegar.
   url:   la direccion /exec de la implementacion de Apps Script.
   clave: debe coincidir con CLAVE_API_() en Codigo.gs.
   ------------------------------------------------------------------ */
var CONFIG = {
  url:   'https://script.google.com/macros/s/AKfycbw8uUDdoxZGFtw0kUWR7ppumFbiKvPZbrtsBPRRwVu7xs2Hn6LM7I9uB7_Z7Z4Z50G_RQ/exec',
  clave: 'cc69be2fa08cc6ae20eec2e1'
};

/**
 * Puente con el Apps Script. El cuerpo va como texto plano a proposito:
 * asi el navegador la trata como peticion simple y no dispara un preflight
 * OPTIONS, que Apps Script no sabe responder.
 * Devuelve los datos directamente, o lanza error.
 */
function llamar(f, args) {
  var cuerpo = { f: f, clave: CONFIG.clave };
  for (var k in (args || {})) cuerpo[k] = args[k];
  return fetch(CONFIG.url, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify(cuerpo)
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (j) {
    if (!j.ok) throw new Error(j.error || 'error del servidor');
    return j.datos;
  });
}
</script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
var $ = function (i) { return document.getElementById(i); };
var show = function (i) {
  var n = document.querySelectorAll('.screen');
  for (var k = 0; k < n.length; k++) n[k].classList.remove('on');
  $(i).classList.add('on');
};

var guardias = [], sel = null, pin = '', sesion = null;
var log = [], cur = null, cola = [];
var stream = null, track = null, det = null, escaneando = false;

// ---------- sesión persistente ----------
try {
  var g = localStorage.getItem('ca_sesion');
  if (g) sesion = JSON.parse(g);
  var q = localStorage.getItem('ca_cola');
  if (q) cola = JSON.parse(q);
  var l = localStorage.getItem('ca_log');
  if (l) log = JSON.parse(l);
} catch (e) {}

function guardaLocal() {
  try {
    localStorage.setItem('ca_sesion', JSON.stringify(sesion));
    localStorage.setItem('ca_cola', JSON.stringify(cola));
    localStorage.setItem('ca_log', JSON.stringify(log));
  } catch (e) {}
}

function pintaBarra() {
  var b = $('pendBar');
  if (cola.length) {
    b.textContent = cola.length + ' registro(s) sin subir — se enviarán solos';
    b.classList.add('on');
  } else b.classList.remove('on');
}

// ---------- arranque ----------
llamar('guardias').then(function (gs) {
  guardias = gs;
  var box = $('guards');
  box.innerHTML = '';
  if (!gs.length) {
    box.innerHTML = '<div class="hint">No hay guardias cargados en la pestaña Personas. ' +
      'Agrega filas con Tipo = Guardia y su PIN.</div>';
    return;
  }
  gs.forEach(function (x, k) {
    var b = document.createElement('button');
    b.className = 'guard';
    b.setAttribute('aria-pressed', 'false');
    var ini = x.nombre.split(' ').map(function (p) { return p[0]; }).slice(0, 2).join('');
    b.innerHTML = '<span class="ini">' + ini + '</span>' + x.nombre;
    b.onclick = function () {
      sel = k; pin = '';
      var cs = box.children;
      for (var j = 0; j < cs.length; j++) cs[j].setAttribute('aria-pressed', j === k);
      pintaPin();
    };
    box.appendChild(b);
  });
}).catch(function () {
  $('guards').innerHTML = '<div class="hint">No se pudo contactar al servidor. ' +
    'Revisa la conexion y recarga la pagina.</div>';
});

for (var k = 0; k < 4; k++) {
  var d = document.createElement('span'); d.className = 'pindot'; $('dots').appendChild(d);
}
[1,2,3,4,5,6,7,8,9,'borrar',0,''].forEach(function (v) {
  var b = document.createElement('button');
  b.className = 'key' + (typeof v === 'string' ? ' ghost' : '');
  b.textContent = v;
  if (v === '') b.disabled = true;
  b.onclick = function () {
    if (sel === null) { $('pinlabel').textContent = 'Primero elige quién está de turno'; return; }
    if (v === 'borrar') pin = pin.slice(0, -1);
    else if (pin.length < 4) pin += v;
    pintaPin();
    if (pin.length === 4) setTimeout(intentaAbrir, 150);
  };
  $('pad').appendChild(b);
});

function pintaPin() {
  var ds = $('dots').children;
  for (var i = 0; i < ds.length; i++) ds[i].classList.toggle('f', i < pin.length);
  $('pinlabel').textContent = 'Clave de 4 dígitos';
}

function intentaAbrir() {
  $('pinlabel').textContent = 'Verificando…';
  llamar('abrirTurno', { run: guardias[sel].run, pin: pin }).then(function (r) {
    if (!r.ok) {
      $('pinwrap').classList.add('bad');
      $('pinlabel').textContent = r.msg;
      setTimeout(function () {
        $('pinwrap').classList.remove('bad'); pin = '';
        var ds = $('dots').children;
        for (var i = 0; i < ds.length; i++) ds[i].classList.remove('f');
      }, 400);
      return;
    }
    sesion = { turnoId: r.turnoId, nombre: r.nombre, run: guardias[sel].run, desde: hora() };
    log = []; guardaLocal(); pintaSesion(); show('s-scan');
  }).catch(function () {
    $('pinlabel').textContent = 'Sin conexión — reintenta';
  });
}

function pintaSesion() {
  if (!sesion) { $('shiftbox').innerHTML = '<b>Sin turno</b>Nadie a cargo'; return; }
  $('shiftbox').innerHTML = '<b>' + sesion.nombre.split(' ')[0] + ' a cargo</b>Turno desde ' + sesion.desde;
}
if (sesion) { pintaSesion(); show('s-scan'); }
pintaBarra();

function hora() {
  var d = new Date();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

// ---------- cámara ----------
$('camBtn').onclick = async function () {
  if (stream) { apaga(); return; }
  $('scanmsg').textContent = 'Pidiendo permiso…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' },
               width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (e) {
    $('scanmsg').textContent = 'No se pudo abrir la cámara: ' + e.name;
    return;
  }
  var v = $('v'); v.srcObject = stream; await v.play();
  track = stream.getVideoTracks()[0];
  var cap = track.getCapabilities ? track.getCapabilities() : {};
  try {
    var adv = [];
    if (cap.exposureCompensation)
      adv.push({ exposureCompensation: Math.max(cap.exposureCompensation.min, -1.5) });
    if (cap.focusMode && cap.focusMode.indexOf('continuous') >= 0)
      adv.push({ focusMode: 'continuous' });
    if (adv.length) await track.applyConstraints({ advanced: adv });
  } catch (e) {}
  if (cap.torch) $('torchBtn').style.display = 'block';
  if ('BarcodeDetector' in window) {
    try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; }
  }
  $('camBtn').textContent = 'Apagar cámara';
  $('scanmsg').textContent = 'Apunta al QR del reverso';
  escaneando = true; bucle();
};

$('torchBtn').onclick = async function () {
  if (!track) return;
  var on = !(track.getSettings().torch);
  try { await track.applyConstraints({ advanced: [{ torch: on }] }); } catch (e) {}
};

function apaga() {
  escaneando = false;
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  stream = null; track = null;
  $('camBtn').textContent = 'Encender cámara';
  $('torchBtn').style.display = 'none';
}

async function bucle() {
  if (!escaneando || !stream) return;
  var v = $('v'), c = $('c');
  if (v.videoWidth) {
    c.width = v.videoWidth; c.height = v.videoHeight;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, c.width, c.height);
    var txt = null;
    try {
      if (det) { var r = await det.detect(c); if (r.length) txt = r[0].rawValue; }
      else {
        var im = ctx.getImageData(0, 0, c.width, c.height);
        var q = jsQR(im.data, c.width, c.height);
        if (q) txt = q.data;
      }
    } catch (e) {}
    if (txt) { leido(txt); return; }
  }
  requestAnimationFrame(bucle);
}

function leido(txt) {
  apaga();
  if (navigator.vibrate) navigator.vibrate(60);
  var run = (txt.match(/RUN=([0-9kK\-]+)/i) || [])[1] || '';
  var ser = (txt.match(/serial=([0-9]+)/i) || [])[1] || '';
  var mrz = (txt.match(/mrz=([0-9]+)/i) || [])[1] || '';
  var ven = '';
  if (mrz && mrz.length >= 24) {
    var e = mrz.slice(17, 23);
    ven = e.slice(4, 6) + '-' + e.slice(2, 4) + '-20' + e.slice(0, 2);
  }
  if (!run) { $('scanmsg').textContent = 'Ese código no es un carnet'; return; }

  cur = { run: run, serie: ser, vence: ven, verificado: true };
  $('c-eyebrow').textContent = 'Consultando…';
  llamar('buscar', { run: run, turnoId: sesion.turnoId }).then(function (r) {
    cur.nombre = r.nombre; cur.tipo = r.tipo; cur.existe = r.encontrada;
    cur.movimiento = r.sugerido; cur.porque = r.porque;
    cur.patente = r.patente; cur.nota = r.nota;
    pinta(false);
  }).catch(function () {
    cur.nombre = ''; cur.existe = false; cur.movimiento = 'Entrada';
    cur.porque = 'Sin conexión — revisa los datos'; cur.patente = ''; cur.nota = null;
    pinta(false);
  });
}

$('noIdBtn').onclick = function () {
  apaga();
  cur = { run: '', serie: '', vence: '', verificado: false, nombre: '', existe: false,
          movimiento: 'Entrada', porque: 'Ingreso manual', patente: '', nota: null };
  pinta(true);
};

function pinta(manual) {
  $('c-eyebrow').textContent = cur.verificado ? 'Carnet leído' : 'Sin carnet — registro manual';
  $('newBlock').style.display = cur.nombre ? 'none' : 'block';
  $('manualRun').style.display = manual ? 'block' : 'none';
  if (!cur.nombre) { $('f-name').value = ''; $('f-type').value = 'Externo'; }
  if (manual) $('f-run').value = '';
  $('c-name').textContent = cur.nombre || 'Persona no registrada';

  var nt = cur.nota, h = '';
  if (nt) {
    h = nt.vencida
      ? '<div class="nota vencida"><span class="k">Nota vencida — no aplicar</span>' +
        'Tenía una autorización que expiró el ' + nt.vence + '. Ya no rige.</div>'
      : '<div class="nota"><span class="k">Nota</span>' + nt.texto +
        '<span class="exp">' + (nt.vence ? 'Vigente hasta el ' + nt.vence + ' · ' : 'Sin fecha de término · ') +
        (nt.por ? 'anotada por ' + nt.por : '') + (nt.fecha ? ' el ' + nt.fecha : '') + '</span></div>';
  }
  $('c-nota').innerHTML = h;

  var r = [];
  if (!manual) {
    r.push(['RUN', cur.run]);
    if (cur.serie) r.push(['N° documento', cur.serie]);
    r.push(['Identidad', '<span class="tag auto">Leída del carnet</span>']);
  } else {
    r.push(['Identidad', '<span class="tag man">Sin verificar</span>']);
  }
  if (cur.tipo) r.push(['Tipo', '<span class="tag">' + cur.tipo + '</span>']);
  r.push(['Registrado por', sesion.nombre.split(' ')[0]]);
  $('c-rows').innerHTML = r.map(function (x) {
    return '<div class="row"><dt>' + x[0] + '</dt><dd>' + x[1] + '</dd></div>';
  }).join('');

  $('f-plate').value = cur.patente || '';
  $('plateHint').textContent = cur.patente ? 'Patente sugerida — la usó la última vez.' : '';
  $('f-why').value = '';
  flecha(); show('s-confirm');
}

function flecha() {
  var inn = cur.movimiento === 'Entrada';
  $('dirCard').classList.toggle('out', !inn);
  $('c-arrow').innerHTML = inn ? '&rarr;' : '&larr;';
  $('c-word').textContent = cur.movimiento;
  $('c-why').textContent = cur.porque;
  $('saveBtn').textContent = 'Confirmar ' + cur.movimiento.toLowerCase();
  $('saveBtn').classList.toggle('out', !inn);
}
$('flipBtn').onclick = function () {
  cur.movimiento = cur.movimiento === 'Entrada' ? 'Salida' : 'Entrada';
  cur.porque = 'Corregido por el guardia'; flecha();
};
$('cancelBtn').onclick = function () { show('s-scan'); };

$('saveBtn').onclick = function () {
  var nom = cur.nombre || $('f-name').value.trim();
  if (!nom) { $('f-name').focus(); $('f-name').style.borderColor = '#FF6A57'; return; }
  var run = cur.run || ($('f-run') ? $('f-run').value.trim() : '');

  var d = {
    run: run, nombre: nom, tipo: cur.tipo || $('f-type').value,
    movimiento: cur.movimiento, verificado: cur.verificado,
    patente: $('f-plate').value.trim(), motivo: $('f-why').value.trim(),
    registradoPor: sesion.nombre, turnoId: sesion.turnoId,
    serie: cur.serie, vence: cur.vence, yaExiste: cur.existe
  };

  $('saveBtn').disabled = true;
  llamar('guardar', { mov: d })
    .then(function () { $('saveBtn').disabled = false; hecho(d); })
    .catch(function () {
      cola.push(d); guardaLocal(); pintaBarra();
      $('saveBtn').disabled = false; hecho(d);
    });
};

function hecho(d) {
  var e = { t: hora(), run: d.run, nombre: d.nombre, mov: d.movimiento,
            ver: d.verificado, patente: d.patente };
  log.push(e); guardaLocal();
  $('tick').classList.toggle('out', d.movimiento === 'Salida');
  $('s-name').textContent = d.nombre;
  $('s-meta').textContent = d.movimiento + ' · ' + e.t +
    (d.patente ? ' · ' + d.patente : '') + (d.verificado ? '' : ' · sin verificar');
  $('log').innerHTML = log.slice().reverse().map(function (x) {
    return '<div class="entry' + (x.mov === 'Salida' ? ' out' : '') + (x.ver ? '' : ' flag') + '">' +
      '<time>' + x.t + '</time><span class="n">' + x.nombre + '</span>' +
      '<span class="tag">' + (x.mov === 'Entrada' ? '&darr; Entra' : '&uarr; Sale') + '</span></div>';
  }).join('');
  show('s-saved');
}
$('nextBtn').onclick = function () { show('s-scan'); };

$('closeBtn').onclick = function () {
  $('closeBody').innerHTML = '<div class="hint">Revisando…</div>';
  show('s-close');
  llamar('cerrarTurno', { turnoId: sesion.turnoId }).then(function (r) {
    var h = '';
    if (r.pendientes.length) {
      h += '<div class="warn"><b>' + r.pendientes.length + ' sin salida registrada</b>' +
        r.pendientes.map(function (p) { return p.nombre + ' entró a las ' + p.hora + '.'; }).join(' ') +
        ' Corrígelo ahora o quedará marcado en la planilla.</div>';
    } else {
      h += '<div class="hint" style="font-size:12.5px;margin-bottom:12px">' +
        'Todas las entradas tienen su salida. Nada pendiente.</div>';
    }
    h += '<dl class="rows" style="border-top:0;padding-top:0">' +
      '<div class="row"><dt>Movimientos</dt><dd>' + r.total + '</dd></div>' +
      '<div class="row"><dt>Sin verificar</dt><dd>' + r.sinVerificar + '</dd></div>' +
      '<div class="row"><dt>Turno a cargo de</dt><dd>' + sesion.nombre + '</dd></div></dl>';
    $('closeBody').innerHTML = h;
  }).catch(function () {
    $('closeBody').innerHTML = '<div class="warn"><b>Sin conexión</b>' +
      'No se pudo revisar. Puedes cerrar igual, se ajustará al reconectar.</div>';
  });
};
$('backBtn').onclick = function () { show('s-scan'); };
$('confirmClose').onclick = function () {
  apaga(); sesion = null; log = []; pin = ''; sel = null;
  guardaLocal(); pintaSesion();
  var cs = $('guards').children;
  for (var j = 0; j < cs.length; j++) cs[j].setAttribute('aria-pressed', 'false');
  var ds = $('dots').children;
  for (var i = 0; i < ds.length; i++) ds[i].classList.remove('f');
  show('s-turno');
};

// ---------- reintento de la cola ----------
setInterval(function () {
  if (!cola.length) return;
  var d = cola[0];
  llamar('guardar', { mov: d }).then(function () {
    cola.shift(); guardaLocal(); pintaBarra();
  }).catch(function () {});
}, 20000);
</script>
</body>
</html>
